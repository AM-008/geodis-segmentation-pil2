[project]
name = "geodis-segmentation-pil2"
version = "0.1.0"
description = "Interactive geodesic image segmentation with web UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
drawing = ["streamlit-drawable-canvas>=0.10.0"]
dev = ["streamlit-drawable-canvas>=0.10.0"]
